<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스마트 시민경찰 AI 법률 자문 서비스</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e3f2fd, #fce4ec);
      font-family: Arial, sans-serif;
      color: #333;
    }
    .container {
      width: min(900px, 92%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.16);
    }
    h1 { margin: 0 0 8px; text-align: center; font-size: 28px; color: #1a237e; }
    .subtitle { text-align: center; color: #555; margin-bottom: 24px; font-size: 14px; font-weight: bold; }
    .info {
      padding: 14px; margin-bottom: 20px; border-radius: 14px;
      background: #e8f5e9; color: #2e7d32; font-size: 14px; line-height: 1.6;
    }
    .chat-box { display: flex; flex-direction: column; gap: 14px; }
    .option-box {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 5px;
    }
    select, input {
      height: 44px; padding: 0 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 14px; outline: none;
    }
    textarea {
      width: 100%; min-height: 140px; resize: vertical; padding: 16px;
      border: 1px solid #ddd; border-radius: 16px; font-size: 16px; line-height: 1.5; outline: none;
    }
    textarea:focus, select:focus, input:focus { border-color: #42a5f5; box-shadow: 0 0 0 3px rgba(66, 165, 245, 0.15); }
    .button-row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
    button, .download-link {
      border: none; border-radius: 12px; padding: 0 18px; height: 46px; font-size: 15px;
      cursor: pointer; transition: 0.15s; font-weight: bold; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center;
    }
    button:hover, .download-link:hover { transform: translateY(-2px); opacity: 0.9; }
    button:disabled { cursor: not-allowed; opacity: 0.6; transform: none; }
    .ask-btn { background: #1e88e5; color: white; }
    .tts-btn { background: #ffb300; color: #333; }
    .clear-btn { background: #b0bec5; color: white; }
    .download-link { background: #7e57c2; color: white; }
    .answer-box {
      min-height: 220px; padding: 18px; border-radius: 18px; background: #f7f9fb;
      border: 1px solid #edf1f5; line-height: 1.7; white-space: pre-wrap; word-break: break-word; font-size: 15px;
    }
    .status { min-height: 24px; color: #555; font-size: 14px; font-weight: bold; }
    .label { font-weight: bold; margin-bottom: 6px; color: #1a237e; }
    .result-box { margin-top: 10px; padding: 18px; border-radius: 18px; background: #f0f4f8; border: 1px solid #d0d7de; }
    audio { width: 100%; margin-top: 5px; }
    .hidden { display: none; }
    @media (max-width: 700px) {
      .option-box { grid-template-columns: 1fr; }
      .button-row { justify-content: stretch; }
      button, .download-link { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>스마트 시민경찰 AI 법률 자문</h1>
    <div class="subtitle">OpenAI 공식 API 연동 다이렉트 시스템</div>

    <div class="info">
      <strong>[이용 방법]</strong><br />
      1. 피해 사실을 아래 '사건 진술'란에 입력합니다.<br />
      2. <strong>[AI 자문 구하기]</strong>를 누르면 관련 법률과 처벌 수위, 대처법을 즉시 분석합니다.<br />
      3. 답변이 완료되면 <strong>[답변 읽어주기]</strong> 버튼이 활성화되어 오디오 가이드를 청취할 수 있습니다.
    </div>

    <div class="label">🔊 AI 음성 설정</div>
    <div class="option-box">
      <select id="modelSelect">
        <option value="tts-1">tts-1 (빠른 생성)</option>
        <option value="tts-1-hd">tts-1-hd (고품질)</option>
      </select>
      <select id="voiceSelect">
        <option value="alloy">alloy (남성형)</option>
        <option value="echo">echo (부드러운 남성)</option>
        <option value="nova">nova (여성형)</option>
        <option value="shimmer">shimmer (지적인 여성)</option>
      </select>
      <input id="speedInput" type="number" min="0.25" max="4.0" step="0.05" value="1.0" />
    </div>

    <div class="chat-box">
      <div>
        <div class="label">사건 진술 (질문)</div>
        <textarea id="questionInput" placeholder="발생한 사건을 상세히 적어주세요."></textarea>
      </div>

      <div class="button-row">
        <button class="clear-btn" id="clearBtn">초기화</button>
        <button class="ask-btn" id="askBtn">AI 자문 구하기</button>
        <button class="tts-btn" id="ttsBtn" disabled>답변 읽어주기</button>
      </div>

      <div id="status" class="status"></div>

      <div>
        <div class="label">AI 종합 법률 자문 결과</div>
        <div id="answerBox" class="answer-box">아직 분석된 자문 내역이 없습니다. 사건을 입력한 후 [AI 자문 구하기]를 눌러주세요.</div>
      </div>

      <div id="resultBox" class="result-box hidden">
        <div class="label">🔊 AI 경찰관 음성 가이드</div>
        <audio id="audioPlayer" controls></audio>
        <div class="button-row" style="margin-top: 10px;">
          <a id="downloadLink" class="download-link" href="#" download="police-guide.mp3">MP3 다운로드</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 🔑 보내주신 최신 OpenAI API Key를 다이렉트로 심어두었습니다.
    const OPENAI_API_KEY = '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';

    const questionInput = document.getElementById('questionInput');
    const answerBox = document.getElementById('answerBox');
    const statusBox = document.getElementById('status');
    const askBtn = document.getElementById('askBtn');
    const ttsBtn = document.getElementById('ttsBtn');
    const clearBtn = document.getElementById('clearBtn');
    const modelSelect = document.getElementById('modelSelect');
    const voiceSelect = document.getElementById('voiceSelect');
    const speedInput = document.getElementById('speedInput');
    const resultBox = document.getElementById('resultBox');
    const audioPlayer = document.getElementById('audioPlayer');
    const downloadLink = document.getElementById('downloadLink');

    let savedAnswerText = "";

    askBtn.addEventListener('click', askChatGPT);
    ttsBtn.addEventListener('click', makeSpeech);
    clearBtn.addEventListener('click', clearPage);

    // 1. ChatGPT에게 질문 던지기
    async function askChatGPT() {
      const question = questionInput.value.trim();
      if (!question) { alert('사건 내용을 입력해주세요.'); return; }

      try {
        askBtn.disabled = true;
        askBtn.textContent = '분석 중...';
        answerBox.textContent = '사건 경위를 분석 중입니다. 잠시만 기다려주세요...';
        statusBox.textContent = 'OpenAI 본사 서버와 통신 중...';
        resultBox.classList.add('hidden');
        ttsBtn.disabled = true;

        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${OPENAI_API_KEY}`
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            messages: [
              { role: 'system', content: '당신은 대한민국 전문 AI 경찰관입니다. 시민의 사건진술을 토대로 1) 예상 법률 조항 및 형량, 2) 증거 수집법 및 대응 요령을 나누어 깔끔하고 친절하게 설명해 주세요.' },
              { role: 'user', content: question }
            ]
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        savedAnswerText = data.choices[0].message.content;
        answerBox.textContent = savedAnswerText;
        statusBox.textContent = '⚖️ AI 자문 완료!';
        ttsBtn.disabled = false;
      } catch (error) {
        console.error(error);
        answerBox.textContent = '오류 발생:\n' + error.message;
        statusBox.textContent = '자문 실패';
      } finally {
        askBtn.disabled = false;
        askBtn.textContent = 'AI 자문 구하기';
      }
    }

    // 2. 답변 내용을 오디오(TTS)로 직접 변환하기
    async function makeSpeech() {
      if (!savedAnswerText) return;
      
      try {
        ttsBtn.disabled = true;
        ttsBtn.textContent = '음성 생성 중...';
        statusBox.textContent = 'AI 음성 파일 인코딩 중...';

        const response = await fetch('https://api.openai.com/v1/audio/speech', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${OPENAI_API_KEY}`
          },
          body: JSON.stringify({
            model: modelSelect.value,
            input: savedAnswerText,
            voice: voiceSelect.value,
            speed: Number(speedInput.value || 1.0)
          })
        });

        if (!response.ok) throw new Error('음성 변환 실패');

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);

        audioPlayer.src = audioUrl;
        downloadLink.href = audioUrl;
        resultBox.classList.remove('hidden');
        statusBox.textContent = '🔊 음성 생성 완료! 재생 버튼을 누르세요.';
      } catch (error) {
        console.error(error);
        statusBox.textContent = '음성 변환 오류';
        alert(error.message);
      } finally {
        ttsBtn.disabled = false;
        ttsBtn.textContent = '답변 읽어주기';
      }
    }

    function clearPage() {
      questionInput.value = '';
      answerBox.textContent = '아직 분석된 자문 내역이 없습니다. 사건을 입력한 후 [AI 자문 구하기]를 눌러주세요.';
      statusBox.textContent = '';
      savedAnswerText = '';
      ttsBtn.disabled = true;
      resultBox.classList.add('hidden');
      audioPlayer.removeAttribute('src');
    }
  </script>
</body>
</html>
