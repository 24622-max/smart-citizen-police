<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>경찰 AI 법률 전문가 시스템</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #1565c0, #e3f2fd);
      font-family: Arial, sans-serif;
      color: #333;
      padding: 40px 0;
    }

    .container {
      width: min(900px, 92%);
      margin: 0 auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    }

    h1 { margin: 0 0 8px; text-align: center; font-size: 28px; color: #0d47a1; }
    .subtitle { text-align: center; color: #555; margin-bottom: 24px; font-size: 14px; font-weight: bold; }
    
    .info {
      padding: 14px; margin-bottom: 20px; border-radius: 14px;
      background: #e8eaf6; color: #1a237e; font-size: 14px; line-height: 1.6; border-left: 5px solid #0d47a1;
    }

    .option-box { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    select, input { height: 44px; padding: 0 12px; border: 1px solid #ddd; border-radius: 12px; font-size: 14px; outline: none; }
    
    textarea {
      width: 100%; min-height: 140px; resize: vertical; padding: 16px;
      border: 1px solid #ccc; border-radius: 16px; font-size: 16px; line-height: 1.5; outline: none;
      font-family: Arial, sans-serif;
    }
    textarea:focus, select:focus, input:focus { border-color: #0d47a1; box-shadow: 0 0 0 3px rgba(13, 71, 161, 0.15); }
    
    .label { font-weight: bold; margin-bottom: 6px; color: #333; }
    
    .button-row { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 10px; }
    button, .download-link {
      border: none; border-radius: 12px; padding: 0 24px; height: 46px; font-size: 15px;
      cursor: pointer; transition: 0.15s; font-weight: bold; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center;
    }
    button:hover, .download-link:hover { transform: translateY(-2px); opacity: 0.9; }
    button:disabled { cursor: not-allowed; opacity: 0.6; transform: none; }
    
    .ask-btn { background: #0d47a1; color: white; }
    .clear-btn { background: #b0bec5; color: white; }
    .download-link { background: #7e57c2; color: white; margin-top: 10px; width: 100%; }

    .result-section { margin-top: 20px; }
    .answer-box {
      min-height: 180px; padding: 18px; border-radius: 18px; background: #fcfdfe;
      border: 1px solid #dcdfe6; line-height: 1.7; white-space: pre-wrap; word-break: break-word; font-size: 15px;
    }
    .audio-box { margin-top: 14px; padding: 14px; background: #f1f3f4; border-radius: 14px; }
    audio { width: 100%; margin-top: 6px; }

    .status { min-height: 24px; margin-top: 10px; color: #666; font-size: 14px; font-weight: 500; }
    .hidden { display: none !important; }

    @media (max-width: 700px) {
      .option-box { grid-template-columns: 1fr; }
      .button-row { justify-content: stretch; }
      button { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>경찰 AI 법률 전문가 시스템</h1>
    <div class="subtitle">법률 상담 및 경찰 민원 안내 / AI 음성 지원 / Firebase 자동 기록</div>

    <div class="info">
      궁금한 법률이나 민원 절차를 질문해 주세요.<br />
      AI가 답변과 안내 음성을 생성하며, 상담 내용은 데이터베이스에 자동으로 안전하게 기록됩니다.
    </div>

    <div class="option-box">
      <select id="modelSelect">
        <option value="tts-1">tts-1 빠른 음성생성</option>
        <option value="tts-1-hd">tts-1-hd 고품질 음성생성</option>
      </select>
      <select id="voiceSelect">
        <option value="alloy">alloy (기본 남성)</option>
        <option value="echo">echo (부드러운 남성)</option>
        <option value="nova">nova (또렷한 여성)</option>
        <option value="shimmer">shimmer (지적인 여성)</option>
      </select>
      <input id="speedInput" type="number" min="0.25" max="4.0" step="0.05" value="1.0" placeholder="재생 속도" />
    </div>

    <div>
      <div class="label">질문 내용</div>
      <textarea id="questionInput" placeholder="경찰 민원이나 법률 관련 질문을 입력하세요. &#10;예: 폭행죄의 성립 요건과 처벌 수위는 어떻게 되나요?"></textarea>
    </div>

    <div class="button-row">
      <button class="clear-btn" id="clearBtn">초기화</button>
      <button class="ask-btn" id="askBtn">질문하기</button>
    </div>

    <div id="status" class="status"></div>

    <div class="result-section">
      <div class="label">AI 전문가 답변</div>
      <div id="answerBox" class="answer-box">아직 답변이 없습니다. 질문을 입력한 후 '질문하기' 버튼을 눌러주세요.</div>
      
      <div id="audioPlayerBox" class="audio-box hidden">
        <div class="label">🔊 답변 안내 음성 듣기</div>
        <audio id="audioPlayer" controls></audio>
        <a id="downloadLink" class="download-link" href="#" download="police-legal-guide.mp3">mp3 음성 파일 다운로드</a>
      </div>
    </div>
  </div>

  <script>
    // 1. Google Apps Script URL (답변과 음성을 가져오는 역할)
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxFg6BHgcSp2eG9czUH6LSPDgGCiCsfGNGgvohehEKnTK5L7U1RgOHKeE426jEG-6ErGg/exec';
    
    // 2. Firebase Database URL (결과를 조용히 저장하는 역할)
    const DATABASE_URL = 'https://test-59732-default-rtdb.firebaseio.com';
    const DATA_PATH = 'items'; // 저장될 폴더 이름

    const questionInput = document.getElementById('questionInput');
    const modelSelect = document.getElementById('modelSelect');
    const voiceSelect = document.getElementById('voiceSelect');
    const speedInput = document.getElementById('speedInput');
    const answerBox = document.getElementById('answerBox');
    const audioPlayerBox = document.getElementById('audioPlayerBox');
    const audioPlayer = document.getElementById('audioPlayer');
    const downloadLink = document.getElementById('downloadLink');
    const statusBox = document.getElementById('status');
    const askBtn = document.getElementById('askBtn');
    const clearBtn = document.getElementById('clearBtn');

    askBtn.addEventListener('click', askPoliceAI);
    clearBtn.addEventListener('click', clearPage);
    questionInput.addEventListener('keydown', function(event) {
      if (event.key === 'Enter' && event.ctrlKey) { askPoliceAI(); }
    });

    // 메인 로직: 질문 -> 답변/음성 생성 -> 화면 출력 -> Firebase 자동 저장
    async function askPoliceAI() {
      const question = questionInput.value.trim();
      const model = modelSelect.value;
      const voice = voiceSelect.value;
      const speed = Number(speedInput.value || 1.0);

      if (!question) {
        alert('질문을 입력해주세요.');
        return;
      }

      try {
        setLoading(true);
        audioPlayerBox.classList.add('hidden');
        answerBox.textContent = 'AI 전문가가 판례와 법률을 분석하고 음성을 생성 중입니다... (약 5~10초 소요)';
        statusBox.textContent = 'AI 서버 연동 중...';

        // 1. Google Apps Script로 질문 전송하여 답변 및 음성 데이터 받아오기
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            question: question,
            model: model,
            voice: voice,
            speed: speed
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error);

        // 2. 텍스트 답변 출력
        const answer = data.answer || '답변을 가져오지 못했습니다.';
        answerBox.textContent = answer;
        
        // 3. 음성 파일 연결
        if (data.audioBase64) {
          const audioUrl = base64ToAudioUrl(data.audioBase64, 'audio/mpeg');
          audioPlayer.src = audioUrl;
          downloadLink.href = audioUrl;
          downloadLink.download = `police-audio-${new Date().getTime()}.mp3`;
          audioPlayerBox.classList.remove('hidden');
        }

        statusBox.textContent = '답변 완료! 데이터를 저장하는 중...';

        // 4. Firebase에 조용히 저장하기 (UI에는 나타나지 않음)
        await saveToFirebase(question, answer);
        
        statusBox.textContent = '답변 완료 및 데이터베이스 기록 완료.';
      } catch (error) {
        console.error(error);
        answerBox.textContent = '오류가 발생했습니다.\n\n' + error.message;
        statusBox.textContent = '요청 실패';
      } finally {
        setLoading(false);
      }
